spring.application.name=employee.management.protal


# Datasource (Postgress)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/empmgmt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


# JPA / Hibernet
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=${SERVER_PORT:8080}


# App - frontend URL used to build verification/reset links
app.frontend-url=${FRONTEND_URL:http://localhost:3000}


# App - JWT
app.jwt.secret=${JWT_SECRET:sdfasdfasdfas0d9f87as079df867a\0s89df60asdf87a0s9d8f7a0s98df7}
app.jwt.access-token-expiry-ms=${ACCESS_TOKEN_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${REFRESH_TOKEN_EXPIRY_MS:604800000}


# App - security policy
app.security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
app.security.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:15}
app.security.verification-token-expiry-minutes=1440
app.security.reset-token-expiry-minutes=15
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


# App - bootstrap SUPERUSER
app.bootstrap.superuser-email=${SUPERUSER_EMAIL:superuser@empmgmt.local}
app.bootstrap.superuser-password=${SUPERUSER_PASSWORD:ChangeMe@123}


# Logging
logging.level.org.springframework.security=INFO
logging.level.com.compny.demo=DEBUG